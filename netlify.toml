# Netlify: connect the repo (or drag-and-drop `dist/`) — these settings are picked up automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node >= 22.12
  NODE_VERSION = "22"

# Private pitch: keep every URL out of search engines, even if the link leaks.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

# Fingerprinted build assets never change.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
